services:
  expense-bot:
    build:
      context: .
      args:
        LARK_CLI_VERSION: "1.0.96"
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}

    image: feishu-expense-bot:latest
    container_name: feishu-expense-bot
    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      OCR_LANG: ${OCR_LANG:-chi_sim+eng}

    volumes:
      - bot-data:/app/runtime
      - lark-cli-config:/home/node/.lark-cli

    init: true

volumes:
  bot-data:
  lark-cli-config: